    priority: 60
    enabled: true
    license: apache-2.0

  - id: vision-document
    display_name: "Llava 7B (Vision Specialist)"
    role: vision
    runtime_id: ollama
    runtime_model_id: llava:7b
    capabilities:
      text: 0.85
