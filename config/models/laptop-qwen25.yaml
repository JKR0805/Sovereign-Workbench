# VAJRA Hardware-Aware Model Profile: Laptop Qwen 2.5 (Low VRAM / Constrained Execution)
# Section V: Bounded for 4.0 - 6.0 GB physical VRAM systems or constrained 8GB setups.
# Prioritizes Qwen 2.5 3B (2.2 GB VRAM) for lightweight general reasoning and
# offers both 3B and 7B coding specialists.

hardware:
  profile: laptop-qwen25
  description: "Constrained 4GB-8GB laptop GPU (e.g. GTX 1650/1660, RTX 3050/4050 Laptop, or thin-and-light setups). Prioritizes Qwen 2.5 3B for minimal VRAM footprint (2.2 GB) with single-resident execution."
  vram_mb: 6144
  max_usable_vram_mb: 5120
  max_loaded_models: 1
  keep_alive: 30m
  preferred_embedding_device: cpu

runtime:
  id: ollama
  kind: ollama
  base_url: http://127.0.0.1:11434

models:
  - id: general-qwen25-3b
    display_name: "Qwen 2.5 3B"
    role: general
    runtime_id: ollama
    runtime_model_id: qwen2.5:3b
    capabilities:
      text: 0.90
      reasoning: 0.85
      coding: 0.85
      tool_calling: 0.85
      structured_output: 0.85
    context_window: 8192
    max_output_tokens: 2048
    num_ctx: 8192
    device: gpu
    vram_gb: 2.2
    quantization: Q4_K_M
    modalities_in:
      - text
    priority: 75
    enabled: true
    license: apache-2.0

  - id: coding-qwen25-3b
    display_name: "Qwen 2.5 Coder 3B"
    role: coding
    runtime_id: ollama
    runtime_model_id: qwen2.5-coder:3b
    capabilities:
      text: 0.85
      coding: 0.90
      tool_calling: 0.85
      structured_output: 0.85
    context_window: 8192
    max_output_tokens: 2048
    num_ctx: 8192
    device: gpu
    vram_gb: 2.2
    quantization: Q4_K_M
    modalities_in:
      - text
    priority: 82
    enabled: true
    license: apache-2.0

  - id: coding-specialist
    display_name: "Qwen 2.5 Coder 7B"
    role: coding
    runtime_id: ollama
    runtime_model_id: qwen2.5-coder:7b
    capabilities:
      text: 0.85
      coding: 0.95
      tool_calling: 0.90
      structured_output: 0.90
    context_window: 8192
    max_output_tokens: 2048
    num_ctx: 8192
    device: gpu
    vram_gb: 4.7
    quantization: Q4_K_M
    modalities_in:
      - text
    priority: 80
    enabled: true
    license: apache-2.0

  - id: general-reasoning
    display_name: "Qwen 3 8B"
    role: general
    runtime_id: ollama
    runtime_model_id: qwen3:8b
    capabilities:
      text: 0.90
      reasoning: 0.85
    context_window: 8192
    max_output_tokens: 2048
    num_ctx: 8192
    device: gpu
    vram_gb: 5.2
    quantization: Q4_K_M
    modalities_in:
