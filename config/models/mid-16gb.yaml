# VAJRA Hardware-Aware Model Profile: Mid 16GB (Desktop Workstation)
# 16 GB physical VRAM, dual-resident execution, larger context limits.

hardware:
  profile: mid-16gb
  description: "16GB desktop workstation GPU (e.g. RTX 4080 16GB / RTX 3090 mobile / RTX 4000 Ada). Up to 2 concurrent models in VRAM."
  vram_mb: 16384
  max_usable_vram_mb: 14500
  max_loaded_models: 2
  keep_alive: 60m
  preferred_embedding_device: cpu

runtime:
  id: ollama
  kind: ollama
  base_url: http://127.0.0.1:11434

models:
  - id: general-reasoning
    display_name: "Qwen 2.5 14B"
    role: general
    runtime_id: ollama
    runtime_model_id: qwen2.5:14b
    capabilities:
      text: 0.92
      reasoning: 0.90
    context_window: 16384
    max_output_tokens: 4096
    num_ctx: 16384
    device: gpu
    vram_gb: 9.0
    quantization: Q4_K_M
    modalities_in:
      - text
    priority: 60
    enabled: true
    license: apache-2.0

  - id: coding-specialist
    display_name: "Qwen 2.5 Coder 14B"
    role: coding
    runtime_id: ollama
    runtime_model_id: qwen2.5-coder:14b
    capabilities:
      text: 0.90
      coding: 0.97
      tool_calling: 0.95
      structured_output: 0.95
    context_window: 16384
    max_output_tokens: 4096
    num_ctx: 16384
    device: gpu
    vram_gb: 9.2
    quantization: Q4_K_M
    modalities_in:
      - text
    priority: 85
    enabled: true
    license: apache-2.0

  - id: vision-document
    display_name: "Qwen 2.5 VL 7B"
    role: vision
    runtime_id: ollama
    runtime_model_id: qwen2.5-vl:7b
    capabilities:
      text: 0.88
      vision: 0.94
      doc_understanding: 0.92
    context_window: 8192
    max_output_tokens: 4096
    num_ctx: 8192
    device: gpu
    vram_gb: 5.5
    quantization: Q4_K_M
    modalities_in:
      - text
      - image
    priority: 75
    enabled: true
    license: apache-2.0

  - id: text-embedding
    display_name: "BGE-M3 (CPU)"
    role: embedding
    runtime_id: ollama
    runtime_model_id: bge-m3
    capabilities:
      embedding: 0.95
    context_window: 8192
    max_output_tokens: 0
    num_ctx: 8192
    device: cpu
    vram_gb: 0.0
    quantization: F16
    modalities_in:
      - text
    priority: 90
    enabled: true
    license: mit
