services:
  # VAJRA FastAPI Backend Orchestrator
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: vajra-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VAJRA_PROFILE=development
      - VAJRA_API_HOST=0.0.0.0
      - VAJRA_API_PORT=8000
      - VAJRA_MODEL_PROFILE=laptop-8gb
      - VAJRA_OLLAMA__BASE_URL=http://host.docker.internal:11434
      - VAJRA_QDRANT__URL=http://qdrant:6333
      - VAJRA_QDRANT__CLOUD_INFERENCE=false
      - VAJRA_RAG__ENABLED=true
      - VAJRA_SOVEREIGNTY__EGRESS_GUARD_ENABLED=false
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    depends_on:
      - qdrant
    networks:
      - vajra_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local Qdrant Vector Store
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: vajra-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__ENABLE_TELEMETRY=false
    volumes:
      - ../data/qdrant:/qdrant/storage:z
    networks:
      - vajra_net

networks:
  vajra_net:
    driver: bridge
